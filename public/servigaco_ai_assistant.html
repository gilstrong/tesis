<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Asistente IA - ServiGaco</title>
  <!-- ESTILOS -->
  <link rel="stylesheet" href="style.css" />
  <!-- ICONOS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
  <!-- TAILWIND CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
<style>
  #chat-bubble { position: absolute; bottom: 24px; right: 24px; width: 52px; height: 52px; border-radius: 50%; background: #6366f1; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; color: white; font-size: 22px; transition: transform 0.2s; z-index: 10; }
  #chat-bubble:hover { transform: scale(1.08); }
  #chat-panel { position: absolute; bottom: 88px; right: 24px; width: 320px; background: var(--color-background-primary); border: 0.5px solid var(--color-border-tertiary); border-radius: var(--border-radius-lg); display: none; flex-direction: column; overflow: hidden; z-index: 10; }
  #chat-header { background: #6366f1; padding: 12px 16px; display: flex; align-items: center; gap: 10px; }
  #chat-header span { color: white; font-size: 14px; font-weight: 500; flex: 1; }
  #chat-header button { background: none; border: none; color: white; cursor: pointer; font-size: 18px; padding: 0; line-height: 1; }
  #chat-messages { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 8px; max-height: 280px; min-height: 180px; }
  .msg { max-width: 85%; padding: 8px 12px; border-radius: 12px; font-size: 13px; line-height: 1.5; }
  .msg.bot { background: var(--color-background-secondary); color: var(--color-text-primary); align-self: flex-start; border-bottom-left-radius: 4px; }
  .msg.user { background: #6366f1; color: white; align-self: flex-end; border-bottom-right-radius: 4px; }
  .msg.loading { opacity: 0.6; }
  #chat-input-area { border-top: 0.5px solid var(--color-border-tertiary); padding: 10px; display: flex; gap: 8px; align-items: flex-end; }
  #chat-input { flex: 1; resize: none; border: 0.5px solid var(--color-border-secondary); border-radius: var(--border-radius-md); padding: 8px 10px; font-size: 13px; font-family: var(--font-sans); min-height: 36px; max-height: 80px; background: var(--color-background-primary); color: var(--color-text-primary); }
  #chat-input:focus { outline: none; border-color: #6366f1; }
  #send-btn { background: #6366f1; border: none; color: white; border-radius: var(--border-radius-md); width: 34px; height: 34px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0; }
  #send-btn:hover { background: #4f46e5; }
  #send-btn:disabled { background: var(--color-background-secondary); color: var(--color-text-tertiary); cursor: not-allowed; }
  .result-card { background: var(--color-background-secondary); border: 0.5px solid var(--color-border-tertiary); border-radius: var(--border-radius-md); padding: 10px 12px; margin-top: 4px; font-size: 12px; }
  .result-card .label { color: var(--color-text-secondary); margin-bottom: 2px; }
  .result-card .price { font-size: 18px; font-weight: 500; color: #6366f1; }
  .notif-dot { position: absolute; top: 10px; right: 10px; width: 10px; height: 10px; background: #ef4444; border-radius: 50%; display: none; border: 2px solid var(--color-background-primary); }
</style>
</head>

<div style="position: relative; min-height: 480px; background: var(--color-background-tertiary); border-radius: var(--border-radius-lg); overflow: hidden;">
  
  <div style="padding: 24px; opacity: 0.4;">
    <div style="height: 28px; background: var(--color-background-secondary); border-radius: 6px; width: 60%; margin-bottom: 12px;"></div>
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px;">
      <div style="height: 80px; background: var(--color-background-primary); border-radius: var(--border-radius-md); border: 0.5px solid var(--color-border-tertiary);"></div>
      <div style="height: 80px; background: var(--color-background-primary); border-radius: var(--border-radius-md); border: 0.5px solid var(--color-border-tertiary);"></div>
    </div>
    <div style="height: 120px; background: var(--color-background-primary); border-radius: var(--border-radius-md); border: 0.5px solid var(--color-border-tertiary);"></div>
    <p style="text-align: center; margin-top: 60px; font-size: 13px; color: var(--color-text-tertiary);">← así se vería en ServiGaco</p>
  </div>

  <button id="chat-bubble" aria-label="Abrir asistente">
    <i class="ti ti-robot" aria-hidden="true"></i>
    <span class="notif-dot" id="notif-dot"></span>
  </button>

  <div id="chat-panel">
    <div id="chat-header">
      <i class="ti ti-robot" style="font-size:18px; color:white;" aria-hidden="true"></i>
      <span>Asistente ServiGaco</span>
      <button id="close-btn" aria-label="Cerrar"><i class="ti ti-x"></i></button>
    </div>
    <div id="chat-messages">
      <div class="msg bot">¡Hola! Dime qué necesitas imprimir y te doy el precio al instante. 🖨️</div>
    </div>
    <div id="chat-input-area">
      <textarea id="chat-input" placeholder="Ej: tesis 120 páginas b/n con empastado..." rows="1"></textarea>
      <button id="send-btn" aria-label="Enviar"><i class="ti ti-send"></i></button>
    </div>
  </div>
</div>

<script>
const bubble = document.getElementById('chat-bubble');
const panel = document.getElementById('chat-panel');
const closeBtn = document.getElementById('close-btn');
const input = document.getElementById('chat-input');
const sendBtn = document.getElementById('send-btn');
const messages = document.getElementById('chat-messages');
const notifDot = document.getElementById('notif-dot');

let isOpen = false;
let history = [];

// El SYSTEM PROMPT se ha movido al backend (server.js) por seguridad.

bubble.addEventListener('click', () => {
  isOpen = !isOpen;
  panel.style.display = isOpen ? 'flex' : 'none';
  notifDot.style.display = 'none';
  if (isOpen) input.focus();
});

closeBtn.addEventListener('click', () => {
  isOpen = false;
  panel.style.display = 'none';
});

input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});
sendBtn.addEventListener('click', sendMessage);

input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 80) + 'px';
});

function addMsg(text, type) {
  const div = document.createElement('div');
  div.className = 'msg ' + type;
  div.textContent = text;
  messages.appendChild(div);
  messages.scrollTop = messages.scrollHeight;
  return div;
}

async function sendMessage() {
  const text = input.value.trim();
  if (!text) return;
  
  input.value = '';
  input.style.height = 'auto';
  sendBtn.disabled = true;
  
  // Agregamos el mensaje visualmente
  addMsg(text, 'user');
  // NO lo agregamos al array 'history' aquí, el backend lo hará al procesar 'mensaje'
  
  const loadingMsg = addMsg('Calculando...', 'bot loading');
  
  try {
    // Detección automática del puerto del servidor Express
    const apiUrl = window.location.port === '5500' ? 'http://localhost:3000/chat-ia' : '/chat-ia';

    const res = await fetch(apiUrl, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        mensaje: text,
        history: history
      })
    });
    
    if (!res.ok) {
        const errorData = await res.json().catch(() => ({}));
        throw new Error(errorData.error || 'Error del servidor');
    }

    const data = await res.json();
    const reply = data.reply || 'No pude procesar eso.';
    
    loadingMsg.remove();
    addMsg(reply, 'bot');
    
    // Ahora sí guardamos en el historial local para la próxima vuelta
    history.push({ role: 'user', content: text });
    history.push({ role: 'assistant', content: reply });
    
    if (!isOpen) {
      notifDot.style.display = 'block';
    }
  } catch(e) {
    console.error('Error Chat:', e);
    loadingMsg.remove();
    addMsg('⚠️ Error de conexión. ¿Iniciaste el servidor con node server.js?', 'bot');
  }
  
  sendBtn.disabled = false;
  input.focus();
}

setTimeout(() => {
  if (!isOpen) notifDot.style.display = 'block';
}, 3000);
</script>
<script src="tracker.js"></script>
</body>
</html>
